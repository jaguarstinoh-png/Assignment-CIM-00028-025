<html>
    <head>
        <title>REGISTRATION FORM</title>
        <style>
      
            body{
                font-family:Arial, Sans-serif;
                background-color: Grey;
                margin:0 0%;
                
            }
            h1{
                text-align: Center;
                Color: Pink;
            }
            table{
                width:100%;
                margin:auto;
                border-collapse:show;
                background-color:White;
            }
            th,td{
                border:11px ;
                padding:12px;
                text-align:left;
                background-color:Orange;
            }
            textarea{
                width:95%;
                height:60%;
                padding:8px;
            }
            .buttons{
                text-align: Center;
                margin-top:20px;
            }
            button{
                padding:10px 25px;
                margin:5px;
                cursor:pointer;
            }
            .submit{
                background-color:Green;
                color:White;
                border:none;
            }
            .reset{
                background-color:Blue;
                color:white;
                border:none;
            }
            
        </style>
    </head>
    <body>
        <h1>Patient Registration form</h1>
        <table border="2">
        <form>
           
           
                <tr> 
                    <th>Patient Info</th> 
                    <th>Details</th>                                                      
                </tr> 
                            
                <tr>
                    <td>Patient Id</td>
                    <td>
<input type="Text" name="Patient_id"place holders="Enter patient ID">
                    </td>
                </tr>
                
                <tr>
                    <td>Full Name</td>
                    <td>
<input type="Text"name="Name"placeholder="Patient's Full Name"                 
                    </td>
                </tr>
                   
                <tr>
                    <td>Age</td>
                    <td>
 <input type="Number"name ="Age"placeholder ="Enter Age" >                                 
                    </td>
                </tr>
                
                <tr>
                    <td>Date of Birth</td>
                    <td>
<input type="Date"name="DoB">                       
                    </td>
                    
                    <tr>
                        <td>Gender</td>
                        <td>
 <input type="Radio" name="radio"   Value="Male">  Male 
<input type ="Radio" name="radio"    Value="Female" >Female      
                        </td>
                    </tr>
                    
                 <tr>
                        <td> Telephone Details</td>
                        <td>
<input type ="Number" name="Number"  placeholder ="Phone Number">                    
                        </td>
                    </tr>
                 
                 <tr>
                     <td>Address</td>
                     <td>
 <textarea name="Address"    placeholder ="Patient's Address" ></textarea>              
                     </td>
                 </tr>   
                    
                    <tr>
                        <td>Health State</td>
                        <td>
<input type ="Checkbox"  name="Health" value="Healthy" >Healthy 
<input type ="Checkbox"  name="Health"  value="Sick">Disability 
<input type ="Checkbox"  name="Health"  value ="Chronic">Chronic Condition
                        </td>
                    </tr>
                    <tr>
                        <td>Marital Status</td>
                        <td>
<input type ="Radio" name="Marital_Status"  Value ="Single" >Single
<input type ="Radio" name="Marital_Status"  Value ="Married" >Married 
<input type ="Radio"  name="Marital Status" Value="Complicated">Complicated 
                        </td>
                    </tr>
                    
                    
                </tr>                         
            </form>
        </table>
    </body>
</html>
